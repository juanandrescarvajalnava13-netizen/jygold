<style>
:root{
  --bg:#000;
  --bg2:#0b0a07;
  --card:#12100b;
  --line:rgba(212,175,55,.28);
  --gold1:#f7d54a;
  --gold2:#d4af37;
  --gold3:#a67c00;
  --text:#f3ead2;
  --muted:#b9a974;
  --gold-grad:linear-gradient(135deg,#ffe066 0%,#f1c40f 38%,#b8860b 100%);
  --wa:#25d366;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Jost',system-ui,sans-serif;font-weight:300;line-height:1.5;min-height:100vh;
  background-image:radial-gradient(1200px 500px at 50% -10%,rgba(212,175,55,.13),transparent 60%)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.gold-text{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* Header */
header.top{position:sticky;top:0;z-index:50;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.brand svg{width:54px;height:54px;flex:none}
.brand-name{font-family:'Cinzel',serif;font-weight:700;font-size:1.5rem;letter-spacing:.14em;line-height:1}
.brand-sub{font-size:.62rem;letter-spacing:.38em;color:var(--muted);margin-top:4px;text-transform:uppercase}
.spacer{flex:1}
.btn-wa{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:var(--wa);color:#04210e;font-weight:500;font-size:.9rem;white-space:nowrap;box-shadow:0 4px 18px rgba(37,211,102,.28);transition:transform .15s}
.btn-wa:hover{transform:translateY(-1px)}
.btn-wa svg{width:20px;height:20px}

/* Hero */
.hero{text-align:center;padding:64px 20px 40px;border-bottom:1px solid var(--line);position:relative}
.hero::before,.hero::after{content:"";display:block;width:140px;height:1px;margin:0 auto;background:var(--gold-grad)}
.hero h1{font-family:'Cinzel',serif;font-weight:600;font-size:clamp(1.9rem,5vw,3.4rem);letter-spacing:.12em;margin:22px 0 10px}
.hero p{font-family:'Cormorant Garamond',serif;font-size:1.25rem;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;margin-bottom:22px}

/* Layout */
.wrap{max-width:1280px;margin:0 auto;padding:30px 20px 100px}
.cat-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.cat-bar a{padding:8px 16px;border:1px solid var(--line);border-radius:999px;font-size:.78rem;letter-spacing:.14em;color:var(--muted);transition:.2s}
.cat-bar a:hover,.cat-bar a.on{color:#000;background:var(--gold-grad);border-color:transparent}
.sec-title{font-family:'Cinzel',serif;font-size:1.5rem;letter-spacing:.14em;margin:6px 0 20px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.sec-title small{font-family:'Jost';font-size:.8rem;letter-spacing:.08em;color:var(--muted)}
.tools{display:flex;gap:12px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.tools input{flex:1;min-width:200px;max-width:380px;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font:inherit;outline:none}
.tools input:focus{border-color:var(--gold2)}
.tools input::placeholder{color:#7f7550}

/* Grids */
.grid-cats{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media(min-width:700px){.grid-cats{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.grid-cats{grid-template-columns:repeat(4,1fr)}}
.tile{display:block;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);transition:.25s}
.tile:hover{border-color:var(--gold2);transform:translateY(-3px);box-shadow:0 10px 30px rgba(212,175,55,.14)}
.tile .im{position:relative;aspect-ratio:1/1;overflow:hidden;background:#0a0905;display:flex;align-items:center;justify-content:center}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.tile:hover img{transform:scale(1.07)}
.tile h3{font-family:'Cinzel',serif;font-weight:600;font-size:.86rem;letter-spacing:.16em;text-align:center;padding:14px 8px}

.grid-prod{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:768px){.grid-prod{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1100px){.grid-prod{grid-template-columns:repeat(6,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-align:left;width:100%;transition:.25s}
.card:hover{border-color:var(--gold2);box-shadow:0 8px 26px rgba(212,175,55,.14)}
.card .im{aspect-ratio:3/4;background:#f2f2f2;overflow:hidden;position:relative}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.card:hover img{transform:scale(1.08)}
.card .info{padding:10px 12px 14px;border-top:1px solid var(--line)}
.card .nm{font-size:.84rem;font-weight:400;line-height:1.3;min-height:2.2em;color:var(--text)}
.card .rf{font-size:.74rem;color:var(--gold2);margin-top:6px;letter-spacing:.06em}
.noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#14110a;color:var(--gold3);font-family:'Cinzel',serif;letter-spacing:.2em;font-size:.9rem}
.empty{padding:50px 10px;color:var(--muted);text-align:center;font-family:'Cormorant Garamond',serif;font-size:1.3rem}

/* Modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.97);display:none;overflow:auto}
.modal.on{display:block}
.m-box{max-width:1000px;margin:0 auto;padding:22px 18px 60px}
.m-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.m-nav{display:flex;gap:8px}
.chip{padding:8px 16px;border:1px solid var(--line);border-radius:999px;font-size:.8rem;letter-spacing:.08em;color:var(--text);transition:.2s}
.chip:hover{border-color:var(--gold2);color:var(--gold1)}
.m-body{display:grid;gap:24px}
@media(min-width:860px){.m-body{grid-template-columns:1.15fr 1fr;align-items:start}}
.gal-main{aspect-ratio:3/4;background:#f2f2f2;border-radius:14px;overflow:hidden;position:relative;border:1px solid var(--line)}
.gal-main img{width:100%;height:100%;object-fit:contain}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.65);color:var(--gold1);font-size:1.4rem;display:flex;align-items:center;justify-content:center}
.arrow.l{left:10px}.arrow.r{right:10px}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:6px}
.thumbs button{flex:none;width:64px;height:84px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#f2f2f2;opacity:.65}
.thumbs button.on{opacity:1;border-color:var(--gold1)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.m-info h2{font-family:'Cinzel',serif;font-weight:600;font-size:1.6rem;letter-spacing:.06em;line-height:1.25;margin-bottom:8px}
.m-info .ref{color:var(--gold2);letter-spacing:.1em;margin-bottom:18px}
.m-info dl{border-top:1px solid var(--line)}
.m-info dl div{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.m-info dt{width:110px;color:var(--muted);flex:none}
.m-info dd{color:var(--text)}
.m-info .btn-wa{margin-top:24px;width:100%;justify-content:center;padding:14px}

/* Floating WhatsApp */
.fab{position:fixed;right:18px;bottom:18px;z-index:120;width:62px;height:62px;border-radius:50%;background:var(--wa);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 26px rgba(37,211,102,.45);transition:transform .2s}
.fab:hover{transform:scale(1.08)}
.fab svg{width:34px;height:34px}

footer{border-top:1px solid var(--line);text-align:center;padding:34px 20px 50px;color:var(--muted);font-size:.8rem;letter-spacing:.12em}
footer .fn{font-family:'Cinzel',serif;font-size:1.1rem;letter-spacing:.2em;margin-bottom:8px}
@media(max-width:560px){.btn-wa span.lbl{display:none}.btn-wa{padding:10px}.brand-name{font-size:1.2rem}.brand svg{width:44px;height:44px}}
</style>

// Archivos cuyo nombre original termina en .JPG.webp / .jpg.webp
const EXTRA_WEBP = {'20060':[1,2],'20344':[1,2]};

const dec = (f, ref, i) => {
  if (f === '') return 'PERFIL.webp';
  if (EXTRA_WEBP[ref] && EXTRA_WEBP[ref].includes(i)) return f + '.webp';
  return /\.(jpe?g|png|heic)$/i.test(f) ? f : f + '.webp';
};
const url = (ref, file) => IMG + encodeURIComponent(ref) + '/' + encodeURIComponent(file);
const P = RAW.map(r => {
  const [name, ref, cat, cover, files] = r;
  return {
    name, ref, cat: CATS[cat],
    cover: url(ref, cover === 0 ? 'PERFIL.webp' : dec(cover, ref, -1)),
    imgs: files.map((f, i) => url(ref, dec(f, ref, i))).filter(s => !/\.heic$/i.test(s)) // .HEIC no lo muestran los navegadores
  };
});
const byCat = {}; CATS.forEach(c => byCat[c] = P.filter(p => p.cat === c));
const slug = c => c.toLowerCase();
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const waLink = msg => 'https://wa.me/' + WA + '?text=' + encodeURIComponent(msg);

document.getElementById('waTop').href = waLink('Hola, quiero información sobre el catálogo de JY GOLD.');
document.getElementById('waFab').href = waLink('Hola, quiero información sobre el catálogo de JY GOLD.');

const view = document.getElementById('view');
const bar = document.getElementById('catBar');
let current = null, list = [];

function renderBar(active){
  bar.innerHTML = CATS.map(c => `<a href="#${slug(c)}" class="${c===active?'on':''}">${c}</a>`).join('');
}

function noimg(el){ el.parentNode.insertAdjacentHTML('beforeend','<div class="noimg">JY GOLD</div>'); el.remove(); }
window.noimg = noimg;

function home(){
  current = null; renderBar(null);
  view.innerHTML = `<h2 class="sec-title gold-text">Categorías</h2><div class="grid-cats">` + CATS.map(c => {
    const f = CATFILE[c];
    const src = f ? CATIMG + f : byCat[c][0] && byCat[c][0].cover;
    return `<a class="tile" href="#${slug(c)}"><div class="im">${src ? `<img src="${esc(src)}" alt="${c}" loading="lazy" referrerpolicy="no-referrer" onerror="noimg(this)">` : `<div class="noimg" style="position:static">JY GOLD</div>`}</div><h3>${c}</h3></a>`;
  }).join('') + `</div>`;
  window.scrollTo(0,0);
}

function category(c){
  current = c; renderBar(c); list = byCat[c];
  view.innerHTML = `<h2 class="sec-title gold-text">${c}<small>${list.length} ${list.length===1?'producto':'productos'}</small></h2>
    <div class="tools"><input id="q" type="search" placeholder="Filtrar por nombre o referencia" aria-label="Filtrar"></div>
    <div id="grid" class="grid-prod"></div>`;
  const draw = q => {
    q = (q||'').trim().toLowerCase();
    const items = q ? list.filter(p => (p.name + ' ' + p.ref).toLowerCase().includes(q)) : list;
    document.getElementById('grid').innerHTML = items.length ? items.map(p => `
      <button class="card" data-ref="${esc(p.ref)}" aria-label="${esc(p.name)}">
        <div class="im"><img src="${esc(p.cover)}" alt="${esc(p.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="noimg(this)"></div>
        <div class="info"><p class="nm">${esc(p.name)}</p><p class="rf">Ref. ${esc(p.ref)}</p></div>
      </button>`).join('') : `<div class="empty" style="grid-column:1/-1">${list.length ? 'No se encontraron productos.' : 'No hay productos en esta categoría.'}</div>`;
  };
  draw('');
  document.getElementById('q').addEventListener('input', e => draw(e.target.value));
  window.scrollTo(0,0);
}

view.addEventListener('click', e => {
  const b = e.target.closest('.card'); if (!b) return;
  openProduct(b.dataset.ref);
});

/* Modal */
const modal = document.getElementById('modal'), mBox = document.getElementById('mBox');
let cur = null, idx = 0;
function openProduct(ref){
  cur = P.find(p => p.ref === ref); idx = 0; paint(); modal.classList.add('on'); modal.scrollTop = 0; document.body.style.overflow='hidden';
}
function closeModal(){ modal.classList.remove('on'); document.body.style.overflow=''; }
function step(d){
  const L = byCat[cur.cat]; const i = L.indexOf(cur); const n = L[(i + d + L.length) % L.length];
  cur = n; idx = 0; paint(); modal.scrollTop = 0;
}
function paint(){
  const p = cur;
  mBox.innerHTML = `
    <div class="m-top">
      <button class="chip" id="mClose">✕ Cerrar</button>
      <div class="m-nav"><button class="chip" id="mPrev">‹ Anterior</button><button class="chip" id="mNext">Siguiente ›</button></div>
    </div>
    <div class="m-body">
      <div>
        <div class="gal-main"><img id="mImg" src="${esc(p.imgs[idx])}" alt="${esc(p.name)}" referrerpolicy="no-referrer" onerror="noimg(this)">
          ${p.imgs.length>1?'<button class="arrow l" id="gPrev" aria-label="Foto anterior">‹</button><button class="arrow r" id="gNext" aria-label="Foto siguiente">›</button>':''}
        </div>
        ${p.imgs.length>1?`<div class="thumbs">${p.imgs.map((s,i)=>`<button class="${i===idx?'on':''}" data-i="${i}" aria-label="Foto ${i+1}"><img src="${esc(s)}" alt="" loading="lazy" referrerpolicy="no-referrer"></button>`).join('')}</div>`:''}
      </div>
      <div class="m-info">
        <h2 class="gold-text">${esc(p.name)}</h2>
        <p class="ref">Ref. ${esc(p.ref)}</p>
        <dl>
          <div><dt>Categoría</dt><dd>${esc(p.cat)}</dd></div>
          <div><dt>Línea</dt><dd>Oro Laminado 18K</dd></div>
        </dl>
        <a class="btn-wa" target="_blank" rel="noopener" href="${waLink('Hola, me interesa: ' + p.name + ' (Ref. ' + p.ref + ') de JY GOLD.')}"><svg><use href="#wa"/></svg><span>Pedir por WhatsApp</span></a>
      </div>
    </div>`;
  const go = i => { idx = (i + p.imgs.length) % p.imgs.length; paint(); };
  mBox.querySelector('#mClose').onclick = closeModal;
  mBox.querySelector('#mPrev').onclick = () => step(-1);
  mBox.querySelector('#mNext').onclick = () => step(1);
  const gp = mBox.querySelector('#gPrev'), gn = mBox.querySelector('#gNext');
  if (gp) { gp.onclick = () => go(idx-1); gn.onclick = () => go(idx+1); }
  mBox.querySelectorAll('.thumbs button').forEach(b => b.onclick = () => go(+b.dataset.i));
}
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => {
  if (!modal.classList.contains('on')) return;
  if (e.key === 'Escape') closeModal();
  else if (e.key === 'ArrowRight') { cur.imgs.length > 1 ? (idx = (idx+1)%cur.imgs.length, paint()) : step(1); }
  else if (e.key === 'ArrowLeft') { cur.imgs.length > 1 ? (idx = (idx-1+cur.imgs.length)%cur.imgs.length, paint()) : step(-1); }
});

function route(){
  const h = decodeURIComponent((location.hash || '').slice(1)).toUpperCase();
  if (CATS.includes(h)) category(h); else home();
}
window.addEventListener('hashchange', route);
route();
</script>
